- name: Ensure .wg directory exists.
  file:
    dest: '{{ wireguard_dest | dirname }}'
    mode: "0700"
    state: directory
  tags:
    - dotfiles
    - install
    - ssh
- name: Install Wireguard ssh key
  copy:
    src: '{{ wireguard_source }}.key'
    dest: '{{ wireguard_dest }}.key'
    mode: "0600"
  tags:
    - dotfiles
    - install
    - ssh
- name: Install Wireguard ssh public key
  copy:
    src: '{{ wireguard_source }}.pub'
    dest: '{{ wireguard_dest }}.pub'
    mode: "0600"
  tags:
    - dotfiles
    - install
    - ssh
